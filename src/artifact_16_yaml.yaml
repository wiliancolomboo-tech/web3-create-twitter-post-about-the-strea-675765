version: "3.8"

services:
  stream-burn-oracle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream_burn_oracle
    restart: always
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"