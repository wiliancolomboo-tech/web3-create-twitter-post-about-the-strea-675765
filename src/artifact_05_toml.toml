[package]
name = "stream-burn-coordinator"
version = "1.0.0"
description = "Verifiable on-chain token burn coordinator for STREAM"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stream_burn_coordinator"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }