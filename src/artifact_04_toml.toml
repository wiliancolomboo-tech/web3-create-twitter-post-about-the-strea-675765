[package]
name = "stream-burn-verifier"
version = "0.1.0"
description = "Deterministic SPL token burn coordinator with event emission for automated social distribution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stream_burn_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }