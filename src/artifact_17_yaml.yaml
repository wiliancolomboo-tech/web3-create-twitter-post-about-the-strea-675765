version: '3.8'

services:
  streampulse-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streampulse-burn-sentinel
    restart: always
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'